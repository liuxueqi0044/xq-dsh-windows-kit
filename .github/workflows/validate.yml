name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
# No actions/cache: dependency caching is intentionally disabled.

jobs:
  validate:
    name: Core tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        # v6.0.2 (de0fac2e4500dabe0009e67214ff5f5447ce83dd)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        # v7.0.0 (5fda3b95a4ea91299a34e894583c3862153e4b97); no dependency cache.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install exact schema validator
        shell: ${{ matrix.shell }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1
      - name: Install exact Pester
        shell: ${{ matrix.shell }}
        run: Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -Repository PSGallery -ErrorAction Stop
      - name: Run validation suite (no network resolver or candidate build)
        shell: ${{ matrix.shell }}
        run: .\tests\Invoke-Tests.ps1 -Mode Validate -SummaryPath .\tests\results\validate-${{ matrix.shell }}.json
      - name: Require summary
        if: always()
        shell: ${{ matrix.shell }}
        run: |
          if (-not (Test-Path .\tests\results\validate-${{ matrix.shell }}.json)) { throw 'M10 summary is missing' }
      - name: Upload test summary
        if: always()
        # v7.0.1 (043fb46d1a93c77aae656e7c1c64a875d1fc6a0a)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m10-validate-${{ matrix.shell }}
          path: tests/results/validate-${{ matrix.shell }}.json
          if-no-files-found: error
