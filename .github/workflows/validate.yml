name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
# No actions/cache: dependency caching is intentionally disabled.

jobs:
  validate-windows-powershell:
    name: Core tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        # v6.0.2 (de0fac2e4500dabe0009e67214ff5f5447ce83dd)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        # v7.0.0 (5fda3b95a4ea91299a34e894583c3862153e4b97); no dependency cache.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install exact schema validator
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1
      - name: Install exact Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -Repository PSGallery -ErrorAction Stop
      - name: Run validation suite (no network resolver or candidate build)
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -Mode Validate -SummaryPath .\tests\results\validate-powershell.json
      - name: Require summary
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path .\tests\results\validate-powershell.json)) { throw 'M10 summary is missing' }
      - name: Upload test summary
        if: always()
        # v7.0.1 (043fb46d1a93c77aae656e7c1c64a875d1fc6a0a)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m10-validate-powershell
          path: tests/results/validate-powershell.json
          if-no-files-found: error

  validate-pwsh:
    name: Core tests (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        # v6.0.2 (de0fac2e4500dabe0009e67214ff5f5447ce83dd)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        # v7.0.0 (5fda3b95a4ea91299a34e894583c3862153e4b97); no dependency cache.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install exact schema validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1
      - name: Install exact Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -Repository PSGallery -ErrorAction Stop
      - name: Run validation suite (no network resolver or candidate build)
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1 -Mode Validate -SummaryPath .\tests\results\validate-pwsh.json
      - name: Require summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path .\tests\results\validate-pwsh.json)) { throw 'M10 summary is missing' }
      - name: Upload test summary
        if: always()
        # v7.0.1 (043fb46d1a93c77aae656e7c1c64a875d1fc6a0a)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m10-validate-pwsh
          path: tests/results/validate-pwsh.json
          if-no-files-found: error
